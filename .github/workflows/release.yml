name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Build & Publish (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo dependencies and target artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu
          cache-all-crates: "true"

      - name: Build release binary
        shell: bash
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package archive & compute checksums
        shell: bash
        run: |
          mkdir -p dist
          SRC_BIN="target/x86_64-unknown-linux-gnu/release/karakuri"
          cp "${SRC_BIN}" karakuri
          tar -czf "dist/karakuri-x86_64-linux.tar.gz" karakuri
          cd dist
          sha256sum * > "karakuri-x86_64-linux.tar.gz.sha256"

      - name: Upload archives to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
